[package]
name = "gtv"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gtv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features off: drops the https/ssh transports (openssl-sys,
# libssh2). Repository READS stay in libgit2 with no transport layer
# (deliberate: the native deps break cross-compiling the universal macOS
# bundle -- no x86_64 OpenSSL sysroot). Network FETCH deliberately does
# NOT use libgit2: it shells out to the system `git fetch` subprocess
# (credential fidelity + zero native-dep risk on every CI target,
# 2026-09-18 user decision; see git_reader.rs fetch_remotes).
git2 = { version = "0.20", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
# Integrated terminal: PTY pair + child process handling for the bottom panel.
portable-pty = "0.9"
# Terminal output is arbitrary bytes; base64 keeps chunks JSON-safe across
# UTF-8 split boundaries (see terminal.rs reader thread).
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

