<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>gtv mock preview</title>
  <style>html, body, #root { height: 100%; margin: 0; }</style>
</head>
<body>
  <div id="root"></div>
  <script>
    // Mock Tauri v2 internals BEFORE app code runs; data from a GitData
    // dump (see docs/tools/gen_inactive_repo.sh; regenerate any repo via dump_json).
    let DATA = null;
    // M3 E2E gear (switchable live from js, no reload needed): the
    // worktree-preflight and checkout-ack stubs below read these on every
    // invoke. 'worktree': 'clean' | 'dirty' | 'merge'; 'checkout': 'ok' | 'err'.
    window.MOCK = { worktree: 'clean', checkout: 'ok' };
    const ready = fetch('/mock-data.json').then(r => r.json()).then(d => {
      DATA = d;
      // The dump predates the head_branch field (M3.2 backend addition):
      // HEAD (a78834f) sits on 'main', which is that lane's tip, so the
      // current-lane marker belongs on the main chip.
      d.head_branch = 'main';
      // Synthetic remote counterparts (M2.3 acceptance): the dump has no
      // origin/* refs at all, so the first three lanes' tip commits (by
      // lane_index, tip = largest x) get an origin/<name> copy of their
      // local ref with is_remote: true. Purely synthetic — a fresh dump
      // from a real repo would carry real remote refs instead.
      for (const lane of [...d.branches].sort((a, b) => a.lane_index - b.lane_index).slice(0, 3)) {
        const cs = d.commits.filter(c => c.lane_owner === lane.name);
        const tip = cs.length > 0 ? cs.reduce((a, b) => (b.x > a.x ? b : a)) : null;
        if (tip) tip.branch_refs.push({ name: `origin/${lane.name}`, is_remote: true, is_tag: false, color: '' });
      }
      // C1 regression pin (final review): the dump has ZERO non-tag lanes
      // without own commits, so the 'all'-view guard on emptyLaneDead was
      // untestable. This synthetic lane is release/v1.x-shaped: non-tag, no
      // commits of its own, its ref pushed onto ANOTHER lane's visible
      // commit. Under 'all' it MUST render as its own visible (empty) row
      // and never sink into a trace row.
      d.branches.push({
        name: 'synthetic/ref-only', lane_index: d.branches.length,
        color: '#6633CC', is_tag: false, fork_point: null,
        merged_into: null, is_active: true,
      });
      const host = d.commits.reduce((a, b) => (b.timestamp > a.timestamp ? b : a));
      host.branch_refs.push({ name: 'synthetic/ref-only', is_remote: false, is_tag: false, color: '' });
      // The dump has no tag LANES either, so the lane-menu regression (tag
      // lanes must NOT offer relatedOnly) had nothing to right-click. Same
      // trick: a synthetic tag lane, ref on the same host commit.
      d.branches.push({
        name: 'synthetic/tag', lane_index: d.branches.length,
        color: '#8B8B00', is_tag: true, fork_point: null,
        merged_into: null, is_active: true,
      });
      host.branch_refs.push({ name: 'synthetic/tag', is_remote: false, is_tag: true, color: '' });
    });
    window.__TAURI_INTERNALS__ = {
      invoke: async (cmd, args) => {
        await ready;
        switch (cmd) {
          case 'open_repository': return DATA;
          case 'get_current_path': return '/mock/taskon-server';
          case 'get_current_branch': return 'marschain';
          case 'get_branch_list': return DATA.branches;
          case 'get_commit_detail': { // build from DATA — the panel needs it
            const c = DATA.commits.find(x => x.id === args?.commitId);
            if (!c) return null;
            return { id: c.id, short_id: c.short_id, message: c.message.split('\n')[0],
              full_message: c.message, author_name: c.author_name, author_email: c.author_email,
              timestamp: c.timestamp, parents: c.parents, branch_refs: c.branch_refs,
              files: [], total_additions: c.additions ?? 0, total_deletions: c.deletions ?? 0 };
          }
          case 'get_patch_links': return DATA._patch_links ?? [];
          case 'filter_by_branches': {
            // CONTRACT APPROXIMATION of the Rust reader (git_reader.rs
            // filter_by_branches): the real backend re-walks the selected
            // tips' lineage and re-runs layout (dense lane_index
            // renumbering, x rescale). The mock cannot re-run layout, so
            // it drops rows from the precomputed dump instead: commits by
            // lane_owner membership, branches by name, edges only when
            // both endpoints survive. Lane indices keep their dump values
            // (deleted rows leave holes) — enough to verify the frontend
            // reacts to a shrunken/rehydrated view, not a pixel-faithful
            // backend. Empty names -> empty view, matching the real
            // zero-seeds-zero-commits semantics.
            const names = new Set(args?.branchNames ?? []);
            const commits = DATA.commits.filter(c => names.has(c.lane_owner));
            const ids = new Set(commits.map(c => c.id));
            const edges = DATA.edges.filter(e => ids.has(e.from) && ids.has(e.to));
            const branches = DATA.branches.filter(b => names.has(b.name));
            return { ...DATA, commits, edges, branches };
          }
          case 'is_valid_git_repo': return true;
          case 'get_recent_logs': return ['[mock] env_logger line'];
          case 'search_commits': {
            const q = String(args?.query ?? '').trim().toLowerCase();
            const limit = args?.limit ?? 50;
            if (q.length < 2) return [];
            return DATA.commits
              .filter(c =>
                c.message.toLowerCase().includes(q) ||
                c.author_name.toLowerCase().includes(q) ||
                (/^[0-9a-f]{4,}$/.test(q) && c.id.startsWith(q)))
              .sort((a, b) => b.timestamp - a.timestamp)
              .slice(0, limit)
              .map(c => ({
                id: c.id, message: c.message, author_name: c.author_name,
                timestamp: c.timestamp,
                // Split at the median x: the LEFT (older) half reads as
                // "outside the loaded window". Caveat: the frontend's local
                // matcher still finds every DATA commit (the mock view is
                // fully loaded) and mergeLocate keeps local hits, so merged
                // hits stay in_view=true — the jump path only fires against
                // the real backend, where deep history is genuinely unloaded.
                in_view: c.x >= (DATA.commits[Math.floor(DATA.commits.length / 2)]?.x ?? 0),
              }));
          }
          case 'jump_to_commit': return DATA;
          case 'get_worktree_status': {
            // CONTRACT APPROXIMATION of git_reader.rs worktree_status: the
            // real backend counts porcelain records; the mock serves three
            // fixed gears (window.MOCK.worktree) so E2E can drive the
            // clean / dirty-confirm / merge-refusal lanes. The dirty counts
            // (3 modified / 2 untracked) are fixed E2E assertion anchors.
            if (window.MOCK.worktree === 'dirty')
              return { modified: 3, untracked: 2, merge_in_progress: false };
            if (window.MOCK.worktree === 'merge')
              return { modified: 0, untracked: 0, merge_in_progress: true };
            return { modified: 0, untracked: 0, merge_in_progress: false };
          }
          case 'checkout_branch': {
            // CONTRACT APPROXIMATION of the Rust safe-checkout writer: the
            // real ack is followed by a repo-changed watcher rebuild; the
            // mock has no watcher, so the ack is the whole effect and the
            // view intentionally stays put (the E2E no-rebuild assertion).
            if (window.MOCK.checkout === 'err')
              throw new Error('mock: uncommitted changes would be overwritten');
            return { branch: args?.branch };
          }
          case 'get_compare_detail': {
            // CONTRACT APPROXIMATION of commands.rs get_compare_detail:
            // real per-file numbers come from git2 tree diffs; the mock
            // cannot run git, so the file list and totals are static
            // synthesis -- added +10/0, deleted 0/-4, modified +6/-2,
            // totals 16/6 -- asserted number by number in E2E. Only the
            // two sides are real DATA commits (looked up by id), so the
            // panel header reflects the actual pair. base === target
            // mirrors git's honest empty diff (spec 5): zero files.
            const side = (id) => {
              const c = DATA.commits.find(x => x.id === id);
              return {
                id,
                short_id: c ? c.short_id : String(id).slice(0, 7),
                subject: c ? c.message.split('\n')[0] : '',
                author: c ? c.author_name : '',
              };
            };
            if (args?.base === args?.target) {
              return { base: side(args?.base), target: side(args?.target), files: [], total_additions: 0, total_deletions: 0 };
            }
            return {
              base: side(args?.base), target: side(args?.target),
              files: [
                { path: 'mock/added.txt', additions: 10, deletions: 0, status: 'A' },
                { path: 'mock/deleted.txt', additions: 0, deletions: 4, status: 'D' },
                { path: 'mock/modified.txt', additions: 6, deletions: 2, status: 'M' },
              ],
              total_additions: 16, total_deletions: 6,
            };
          }
          case 'get_pair_file_diff': {
            // CONTRACT APPROXIMATION: same static-synthesis stance -- one
            // hand-written patch served for any file of any pair. The two
            // '-' lines and three '+' lines are E2E substring anchors.
            return [
              'diff --git a/mock/modified.txt b/mock/modified.txt',
              '--- a/mock/modified.txt',
              '+++ b/mock/modified.txt',
              '@@ -1,3 +1,6 @@',
              ' kept context line',
              '-mock removed line one',
              '-mock removed line two',
              '+mock added line one',
              '+mock added line two',
              '+mock added line three',
              ' kept trailing line',
            ].join('\n');
          }
          default: return null; // plugin:dialog|open -> null (no native dialog)
        }
      },
      transformCallback: () => 0,
    };
    localStorage.setItem('gtv_latest_repo', '/mock/taskon-server');
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
