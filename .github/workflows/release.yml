name: Release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# A "Sync version from tag" step rewrites package.json / tauri.conf.json /
# Cargo.toml versions from the tag before building, so artifact names always
# match the tag. The workflow builds all platform bundles and attaches them
# to a draft GitHub release — review and publish it manually.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS build (Apple Silicon + Intel in one artifact),
          # built on the arm64 runner — no dependence on the legacy
          # macos-13 Intel runner label.
          - os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: ''
          - os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Bundle filenames come from tauri.conf.json's version field, NOT from
      # the git tag — so overwrite every version field from the tag before
      # building. Tagging alone is then enough; no manual version bump needed.
      - name: Sync version from tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "Syncing all version fields to $V"
          npm version "$V" --no-git-tag-version --allow-same-version
          sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$V\"/" src-tauri/tauri.conf.json
          sed -i.bak "s/^version = .*/version = \"$V\"/" src-tauri/Cargo.toml
          grep '"version"' package.json src-tauri/tauri.conf.json | head -2
          grep '^version' src-tauri/Cargo.toml

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'gtv ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
